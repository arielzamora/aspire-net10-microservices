server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # appsettings.json lo genera el contenedor al arrancar: que no se cachee
    location = /appsettings.json {
        add_header Cache-Control "no-store";
    }

    # Blazor WebAssembly es una SPA: cualquier ruta cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
