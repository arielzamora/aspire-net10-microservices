name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # También lo reutiliza deploy.yml: si fallan los tests, no se despliega.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Los tests de Aspire levantan el AppHost por HTTP en el runner
  ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build MasterNet.sln -c Release

      # Cada suite es un paso separado: se ve cuál falla y cuánto tarda.
      - name: Tests unitarios
        run: >
          dotnet test tests/MasterNet.Application.UnitTests -c Release --no-build
          --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Tests de integración tradicionales (WebApplicationFactory)
        run: >
          dotnet test tests/MasterNet.IntegrationTests -c Release --no-build
          --filter "FullyQualifiedName~Traditional"
          --logger "trx;LogFileName=integration-traditional.trx" --results-directory TestResults

      - name: Tests de integración con Aspire (Aspire.Hosting.Testing)
        run: >
          dotnet test tests/MasterNet.IntegrationTests -c Release --no-build
          --filter "FullyQualifiedName~AspireTesting"
          --logger "trx;LogFileName=integration-aspire.trx" --results-directory TestResults

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
